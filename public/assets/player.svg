<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="heroGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#a855f7" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Wizard Cape -->
  <path d="M 30,50 L 15,100 L 40,110 L 60,90 L 80,110 L 105,100 L 90,50 Z" fill="#6d28d9" stroke="#4c1d95" stroke-width="3"/>
  <!-- Body Tux Penguin -->
  <ellipse cx="60" cy="70" rx="30" ry="35" fill="#0f172a" stroke="#1e293b" stroke-width="3" filter="url(#heroGlow)"/>
  <!-- White Belly -->
  <ellipse cx="60" cy="74" rx="18" ry="24" fill="#f8fafc"/>
  <!-- Head -->
  <circle cx="60" cy="40" r="22" fill="#0f172a"/>
  <!-- Face & Eyes -->
  <ellipse cx="60" cy="42" rx="16" ry="14" fill="#1e293b"/>
  <ellipse cx="52" cy="40" rx="5" ry="7" fill="#ffffff"/>
  <ellipse cx="68" cy="40" rx="5" ry="7" fill="#ffffff"/>
  <circle cx="53" cy="40" r="3" fill="#0284c7"/>
  <circle cx="67" cy="40" r="3" fill="#0284c7"/>
  <!-- Beak -->
  <polygon points="52,47 68,47 60,57" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <!-- Wizard Hat -->
  <path d="M 25,32 Q 60,25 95,32 L 85,25 L 75,5 L 60,0 L 45,5 L 35,25 Z" fill="#7c3aed" stroke="#c084fc" stroke-width="3"/>
  <path d="M 30,30 Q 60,22 90,30 L 92,34 Q 60,26 28,34 Z" fill="#fbbf24"/>
  <polygon points="60,6 63,12 70,12 64,16 66,22 60,18 54,22 56,16 50,12 57,12" fill="#fbbf24"/>
  <!-- Magic Staff / Sword -->
  <rect x="92" y="30" width="6" height="75" rx="3" fill="#78350f" stroke="#451a03" stroke-width="2"/>
  <circle cx="95" cy="25" r="12" fill="#38bdf8" stroke="#0284c7" stroke-width="3" filter="url(#heroGlow)"/>
  <polygon points="95,10 99,20 109,20 101,26 104,36 95,30 86,36 89,26 81,20 91,20" fill="#f0f9ff"/>
  <!-- Feet -->
  <path d="M 40,102 Q 35,112 25,112 Q 40,118 50,105 Z" fill="#f59e0b"/>
  <path d="M 80,102 Q 85,112 95,112 Q 80,118 70,105 Z" fill="#f59e0b"/>
</svg>
