<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="bugGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#22c55e" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Antennae -->
  <path d="M 45,35 Q 25,10 15,15 M 75,35 Q 95,10 105,15" stroke="#4ade80" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle cx="15" cy="15" r="6" fill="#ef4444" filter="url(#bugGlow)"/>
  <circle cx="105" cy="15" r="6" fill="#ef4444" filter="url(#bugGlow)"/>
  <!-- Legs -->
  <path d="M 25,60 L 5,50 M 20,75 L 2,75 M 25,90 L 8,100" stroke="#166534" stroke-width="5" stroke-linecap="round"/>
  <path d="M 95,60 L 115,50 M 100,75 L 118,75 M 95,90 L 112,100" stroke="#166534" stroke-width="5" stroke-linecap="round"/>
  <!-- Body segments -->
  <circle cx="60" cy="95" r="18" fill="#15803d" stroke="#166534" stroke-width="3"/>
  <circle cx="60" cy="72" r="22" fill="#22c55e" stroke="#15803d" stroke-width="3"/>
  <circle cx="60" cy="45" r="24" fill="#4ade80" stroke="#22c55e" stroke-width="3" filter="url(#bugGlow)"/>
  <!-- Cyber bug teeth / mouth -->
  <polygon points="50,55 55,63 60,55 65,63 70,55" fill="#ef4444"/>
  <!-- Angry Bug Eyes -->
  <ellipse cx="46" cy="38" rx="8" ry="10" fill="#000000"/>
  <ellipse cx="74" cy="38" rx="8" ry="10" fill="#000000"/>
  <circle cx="48" cy="36" r="4" fill="#ef4444"/>
  <circle cx="72" cy="36" r="4" fill="#ef4444"/>
  <!-- Glitch pixel marks -->
  <rect x="52" y="75" width="16" height="4" fill="#86efac"/>
  <rect x="55" y="82" width="10" height="4" fill="#86efac"/>
</svg>
