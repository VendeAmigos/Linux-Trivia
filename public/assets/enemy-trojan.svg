<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="trojanGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#eab308" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Wooden / Mech Horse Head & Body -->
  <!-- Legs -->
  <rect x="35" y="80" width="10" height="30" fill="#854d0e" stroke="#451a03" stroke-width="2"/>
  <rect x="50" y="80" width="10" height="30" fill="#a16207" stroke="#451a03" stroke-width="2"/>
  <rect x="70" y="80" width="10" height="30" fill="#854d0e" stroke="#451a03" stroke-width="2"/>
  <rect x="85" y="80" width="10" height="30" fill="#a16207" stroke="#451a03" stroke-width="2"/>
  <!-- Torso -->
  <rect x="30" y="50" width="65" height="35" rx="5" fill="#ca8a04" stroke="#713f12" stroke-width="4" filter="url(#trojanGlow)"/>
  <!-- Trojan trapdoor hatch -->
  <rect x="45" y="58" width="25" height="20" fill="#854d0e" stroke="#ef4444" stroke-width="2"/>
  <circle cx="57" cy="68" r="3" fill="#ef4444"/>
  <!-- Neck & Head -->
  <path d="M 75,55 L 95,25 L 110,35 L 95,65 Z" fill="#ca8a04" stroke="#713f12" stroke-width="3"/>
  <path d="M 90,28 L 115,25 L 110,40 L 95,38 Z" fill="#eab308" stroke="#713f12" stroke-width="2"/>
  <!-- Red Glowing Eye -->
  <polygon points="102,30 110,30 106,36" fill="#ef4444"/>
  <!-- Mane -->
  <path d="M 72,50 L 78,35 L 85,25 L 80,45 Z" fill="#ef4444"/>
  <!-- Tail -->
  <path d="M 30,55 Q 15,65 10,85 Q 22,75 30,65 Z" fill="#ef4444"/>
</svg>
