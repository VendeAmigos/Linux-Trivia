<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="hackerGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#22d3ee" flood-opacity="0.9"/>
    </filter>
  </defs>
  <!-- Dark Hood -->
  <path d="M 20,110 L 30,55 L 60,15 L 90,55 L 100,110 Z" fill="#090d16" stroke="#1e293b" stroke-width="4"/>
  <path d="M 32,58 L 60,25 L 88,58 L 82,95 L 38,95 Z" fill="#0f172a" stroke="#22d3ee" stroke-width="2" filter="url(#hackerGlow)"/>
  <!-- Glowing Anonymous / Cyber Mask -->
  <polygon points="42,50 78,50 72,82 60,92 48,82" fill="#181825" stroke="#22d3ee" stroke-width="3"/>
  <!-- Matrix / Cyber Visor Lines -->
  <rect x="46" y="58" width="28" height="6" fill="#22d3ee"/>
  <path d="M 50,72 L 70,72" stroke="#ef4444" stroke-width="3"/>
  <!-- Laptop in front -->
  <polygon points="25,115 95,115 88,98 32,98" fill="#334155" stroke="#475569" stroke-width="2"/>
  <rect x="35" y="102" width="50" height="10" fill="#0284c7"/>
  <!-- Matrix Code Binary Floating -->
  <text x="10" y="30" fill="#22c55e" font-size="10" font-family="monospace">01</text>
  <text x="95" y="40" fill="#22c55e" font-size="10" font-family="monospace">10</text>
  <text x="15" y="70" fill="#22c55e" font-size="10" font-family="monospace">11</text>
  <text x="92" y="80" fill="#22c55e" font-size="10" font-family="monospace">00</text>
</svg>
