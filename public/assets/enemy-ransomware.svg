<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="ransomGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.9"/>
    </filter>
  </defs>
  <!-- Lock Shackle -->
  <path d="M 38,55 L 38,30 A 22,22 0 0,1 82,30 L 82,55" fill="none" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
  <!-- Lock Body -->
  <rect x="22" y="50" width="76" height="60" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="4" filter="url(#ransomGlow)"/>
  <!-- Cyber Skull face on padlock -->
  <!-- Skull Head -->
  <path d="M 40,62 Q 60,54 80,62 L 78,82 Q 60,90 42,82 Z" fill="#f8fafc"/>
  <!-- Eye Sockets -->
  <polygon points="46,67 56,67 51,77" fill="#ef4444"/>
  <polygon points="64,67 74,67 69,77" fill="#ef4444"/>
  <!-- Teeth / Lock Keyhole -->
  <rect x="50" y="82" width="5" height="10" fill="#0f172a"/>
  <rect x="58" y="82" width="5" height="10" fill="#0f172a"/>
  <rect x="66" y="82" width="5" height="10" fill="#0f172a"/>
  <!-- Warning emblem / chains -->
  <path d="M 10,95 L 30,75 M 110,95 L 90,75 M 10,25 L 30,45 M 110,25 L 90,45" stroke="#dc2626" stroke-width="4" stroke-dasharray="6,4"/>
</svg>
